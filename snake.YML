# ==============================================================================
# Save this file at: .github/workflows/snake.yml  (inside your PraveenMarappan/PraveenMarappan repo)
# It regenerates the contribution-snake SVGs on a schedule and on manual trigger,
# then pushes them to an `output` branch that the README reads from.
# Uses Platane/snk — the current, actively maintained snake-animation action.
# ==============================================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # allows manual "Run workflow" button
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
